  <!-- Netlify Forms detection form. Netlify parses forms from static HTML at
       DEPLOY time; the visible form is rendered by React at runtime, which the
       build bot can't see. This hidden form is what registers "contact" with
       Netlify. Its field names MUST match the payload posted by
       pages/ContactForm.jsx (see the fetch() in submit()). -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="firstName" />
    <input type="text" name="lastName" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="company" />
    <input type="text" name="inquiryType" />
    <textarea name="message"></textarea>
    <input type="text" name="bot-field" />
  </form>
