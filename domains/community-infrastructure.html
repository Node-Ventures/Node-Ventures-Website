  <style>:root { --font-display: "SUSE", "Helvetica Neue", Arial, sans-serif; }</style>
  <style>
    :root { --page-pad: 56px; --content-max: 1240px; --nv-rule: #ddd5c6; --color-canvas: #F9FAF7; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--color-canvas); }
    body { font-family: var(--font-body); color: var(--color-ink); }
    [style*="--font-display"] { font-weight: 400 !important; letter-spacing: normal !important; }

    #nv-page { overflow-x: clip; }
    .nv-grid-band { position: relative; }
    .nv-band-inner { max-width: var(--content-max); margin: 0 auto; padding-left: var(--page-pad); padding-right: var(--page-pad); }

    :root {
      --h1-size: clamp(34px, 4.2vw, 51px); --h1-weight: 300; --h1-line: 1.05; --h1-track: -1.2px;
      --h2-size: clamp(32px, 4vw, 48px);   --h2-weight: 400; --h2-line: 1.05; --h2-track: -0.9px;
      --h3-size: clamp(24px, 2.8vw, 34px); --h3-weight: 400; --h3-line: 1.15; --h3-track: -0.5px;
      --h4-size: 24px;                     --h4-weight: 400; --h4-line: 1.2;  --h4-track: -0.4px;
      --body-lg-size: 18px; --body-lg-line: 1.42;
      --body-size: 16px;    --body-line: 1.42;
      --body-sm-size: 14px; --body-sm-line: 1.5;
      --caption-size: 13px; --caption-line: 1.4;
      --color-primary-on-dark: #b9a9ff;
      --color-surface-dark: var(--color-ink);
      --color-active-row: #f2f3ee;
      --color-grid-line: #d7d4cc;
      --color-grid-line-dark: #403d38;
    }

    .nv-label { display: inline-flex; align-items: center; gap: 8px; background: transparent; color: var(--color-primary); font-family: var(--font-mono); font-weight: 500; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; padding: 0; }
    .nv-label::before { content: ""; width: 9px; height: 9px; flex: none; background: var(--color-primary); }

    .nv-link, .nv-link-plain { position: relative; display: inline-flex; vertical-align: bottom; }
    .nv-link > span, .nv-link-plain > span { display: block; white-space: nowrap; transition: color 0.2s ease; }
    .nv-link:hover > span, .nv-link-plain:hover > span { color: var(--color-primary); }

    a { color: var(--color-primary); text-decoration: none; }
    a:hover { color: var(--color-primary-active); }

    button[style*="--color-primary"]:not(:disabled):hover { background: var(--color-primary-active) !important; }
    button[style*="repeating-linear-gradient"]:not(:disabled):hover {
      background: var(--color-primary) !important; background-image: none !important;
      color: var(--color-on-primary) !important; border-color: var(--color-primary) !important;
    }

    /* ============ VENTURES RAIL ============ */
    .nv-rail { display: flex; gap: 24px; overflow-x: auto; scroll-snap-type: x proximity;
      padding-top: 4px; padding-bottom: 20px;
      padding-left: max(var(--page-pad), calc((100vw - var(--content-max)) / 2 + var(--page-pad)));
      padding-right: max(var(--page-pad), calc((100vw - var(--content-max)) / 2 + var(--page-pad)));
      scroll-padding-left: max(var(--page-pad), calc((100vw - var(--content-max)) / 2 + var(--page-pad)));
      -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .nv-rail::-webkit-scrollbar { display: none; }
    .nv-rail-card { flex: 0 0 340px; scroll-snap-align: start; min-height: 200px; }

    /* ============ PROCESS FLOW ============ */
    .nv-flow { display: flex; flex-direction: column; }
    .nv-flow-step { display: grid; grid-template-columns: 44px 1fr; gap: 22px; align-items: start; }
    .nv-flow-node { display: flex; flex-direction: column; align-items: center; align-self: stretch; }
    .nv-flow-circle { width: 44px; height: 44px; flex: none; border-radius: 50%;
      border: 1px solid var(--color-primary); color: var(--color-primary); background: var(--color-canvas);
      display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.02em; }
    .nv-flow-line { flex: 1 1 auto; width: 1px; min-height: 30px;
      background-image: linear-gradient(var(--color-primary) 55%, transparent 0); background-size: 1px 9px; background-repeat: repeat-y; opacity: 0.55; }
    .nv-flow-label { padding: 9px 0 30px; }
    .nv-flow-step:last-child .nv-flow-label { padding-bottom: 0; }

    /* ============ MOBILE ============ */
    @media (max-width: 760px) {
      :root { --page-pad: 20px; }
      .nv-2col { grid-template-columns: 1fr !important; gap: 32px !important; }
      .nv-cap-row { grid-template-columns: 1fr !important; gap: 14px !important; }
      .nv-venture-grid { grid-template-columns: 1fr !important; }
      .nv-gridlines { display: none !important; }

      /* Why this domain: horizontal swipe cards, next card peeking (like homepage Invest) */
      .nv-swipe .nv-focus-boxes {
        display: flex !important; grid-template-columns: none !important;
        gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch; padding: 4px var(--page-pad) 20px 0;
        margin-right: calc(-1 * var(--page-pad)); scroll-padding-left: 0;
        border: none !important; scrollbar-width: none;
      }
      .nv-swipe .nv-focus-boxes::-webkit-scrollbar { display: none; }
      .nv-swipe .nv-focus-boxes > div {
        scroll-snap-align: start; flex: 0 0 82%; min-height: auto !important;
        border: 1px solid var(--color-grid-line); padding: 24px !important;
      }

      /* Get involved: stacked bordered boxes */
      .nv-getinvolved .nv-focus-boxes { border-top: 1px solid var(--color-grid-line); border-bottom: 1px solid var(--color-grid-line); }
      .nv-getinvolved .nv-focus-boxes > div { min-height: auto !important; padding: 28px 4px !important; border-bottom: 1px solid var(--color-grid-line); }
      .nv-getinvolved .nv-focus-boxes > div:last-child { border-bottom: none; }

      /* Ventures: no arrow controls on mobile, cards peek */
      .nv-rail-arrows { display: none !important; }
      .nv-rail-card { flex: 0 0 82vw !important; }

      /* Quote: exactly like homepage mobile quote */
      .nv-quote-row { flex-direction: column !important; gap: 24px !important; }
      .nv-quote-photo { flex: 0 0 auto !important; width: 150px !important; height: 190px !important; align-self: flex-start !important; }
      .nv-quote-foot { flex-direction: column !important; align-items: flex-start !important; gap: 18px !important; }

      /* CTA: tighter padding + divider line above the footer */
      .nv-cta { border-bottom: 1px solid var(--color-grid-line-dark); }
      .nv-cta .nv-focus-boxes > div { padding: 44px 20px !important; min-height: auto !important; }

      /* Footer: exactly like homepage mobile footer */
      .nv-footer-box { padding: 32px 20px 0 !important; min-height: auto !important; }
      .nv-footer-legal { left: 20px !important; }
      .nv-footer-grid { grid-template-columns: 1fr 1fr !important; gap: 28px !important; }
      .nv-footer-grid > div:first-child { grid-column: 1 / -1; }
    }
  </style>
